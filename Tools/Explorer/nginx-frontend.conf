map $http_upgrade $explorer_connection_upgrade { default upgrade; '' close; }
map $upstream_status $explorer_ipfs_cache {
    default "no-store";
    200 "public, max-age=86400, immutable";
    206 "public, max-age=86400, immutable";
}
# Per client address. The card service on Backend-01 (PLATFORM_EXPLORER_URL: fee history, inventory, the worker,
# verification relays) is one server making many calls, so it has its own, wider zone; a browser keeps 30 r/s. Loopback is
# the kit's front door (127.0.0.1:8448) and wallet gate (:8450), which limit each client themselves: not counted here (the
# kit's --exempt-front-door, done by the map so a reload never re-keys a zone). An empty key is not limited in that zone.
map $remote_addr $explorer_ui_key      { 127.0.0.1 ""; 100.111.67.1 ""; default $binary_remote_addr; }
map $remote_addr $explorer_service_key { 100.111.67.1 $binary_remote_addr; default ""; }
limit_req_zone $explorer_ui_key zone=explorer_client:10m rate=30r/s;
limit_req_zone $explorer_service_key zone=explorer_service:1m rate=100r/s;
limit_conn_zone $explorer_ui_key zone=explorer_client_connections:10m;
limit_conn_zone $explorer_service_key zone=explorer_service_connections:1m;
upstream explorer_ui_origin { server 127.0.0.1:3001; keepalive 16; }
upstream explorer_backend_nebula { server 100.111.67.2:4002; keepalive 16; }   # Blockscout on Indexer-01
upstream explorer_archive_rpc { server 100.111.69.2:8547; keepalive 8; }       # Archive-01 (its nginx; Frontend-01 is allow-listed)
server {
    listen 100.111.69.1:8080;
    listen 127.0.0.1:8080;
    server_name 100.111.69.1;
    # Private until Chad exposes it (2026-11-26): loopback (the kit's front door and wallet gate), the Mac and Chad's laptop.
    allow 127.0.0.1;
    allow 100.111.1.32;   # the Mac
    allow 100.111.1.3;    # Chad's laptop
    allow 100.111.67.1;   # Backend-01: the card service, server side (PLATFORM_EXPLORER_URL)
    deny all;
    client_max_body_size 8m;
    limit_req zone=explorer_client burst=100 nodelay;
    limit_req zone=explorer_service burst=300 nodelay;
    limit_req_status 429;
    limit_conn explorer_client_connections 80;
    limit_conn explorer_service_connections 200;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Appended to, not replaced (the kit's explorer-public.py forwarding): Blockscout reads "client, 127.0.0.1, Frontend-01"
    # and counts the front door's clients apart (backend.env API_RATE_LIMIT_REMOTE_IP_KNOWN_PROXIES).
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_next_upstream off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    location = /api/eth-rpc {
        if ($request_method != POST) { return 405; }
        proxy_set_header Origin "";
        proxy_set_header Host 100.111.69.2;
        proxy_pass http://explorer_archive_rpc/;
    }
    location = /rpc {
        if ($request_method != POST) { return 405; }
        proxy_set_header Origin "";
        proxy_set_header Host 100.111.69.2;
        proxy_pass http://explorer_archive_rpc/;
    }
    # The wallet RPC over Nebula: the kit's cryft-rpc-gate (127.0.0.1:8450; its method allow-list, limits and chain id),
    # answered for its own name. A wallet's network entry: http://100.111.69.1:8080/wallet-rpc, chain 113211.
    location = /wallet-rpc {
        if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }
        proxy_set_header Host rpc.cryft.cards;
        proxy_set_header Origin "";
        proxy_pass http://127.0.0.1:8450/;
    }
    location = /api { proxy_pass http://explorer_backend_nebula; }
    location ^~ /api/ { proxy_pass http://explorer_backend_nebula; }
    location /socket {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $explorer_connection_upgrade;
        proxy_pass http://explorer_backend_nebula;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
    # NFT media and metadata: same-origin read-only path to the private Kubo gateway
    # on Backend-01 (nginx :8082). Blockscout rewrites ipfs:// links to this prefix.
    location ^~ /ipfs/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://100.111.67.1:8082/ipfs/;
        proxy_set_header Host 100.111.67.1;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_read_timeout 60s;
        add_header Cache-Control $explorer_ipfs_cache always;
        add_header X-Content-Type-Options nosniff always;
        # Untrusted HTML/SVG on a path gateway must not execute as the explorer.
        add_header Content-Security-Policy "default-src 'none'; img-src data:; style-src 'unsafe-inline'; sandbox" always;
    }
    location / { proxy_pass http://explorer_ui_origin; }
}
