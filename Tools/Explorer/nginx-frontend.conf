map $http_upgrade $explorer_connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=explorer_ui:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=explorer_ui_connections:10m;
upstream explorer_ui_origin { server 127.0.0.1:3001; keepalive 16; }
upstream explorer_backend_nebula { server 100.111.67.1:4002; keepalive 16; }
server {
    listen 100.111.69.1:8080;
    listen 127.0.0.1:8080;
    server_name 100.111.69.1;
    allow 127.0.0.1;
    allow 100.111.0.0/16;
    deny all;
    client_max_body_size 8m;
    limit_req zone=explorer_ui burst=100 nodelay;
    limit_req_status 429;
    limit_conn explorer_ui_connections 80;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_next_upstream off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    location = /api/eth-rpc {
        if ($request_method != POST) { return 405; }
        proxy_set_header Origin "";
        proxy_pass http://127.0.0.1:8547/;
    }
    location = /rpc {
        if ($request_method != POST) { return 405; }
        proxy_set_header Origin "";
        proxy_pass http://127.0.0.1:8547/;
    }
    location = /api { proxy_pass http://explorer_backend_nebula; }
    location ^~ /api/ { proxy_pass http://explorer_backend_nebula; }
    location /socket {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $explorer_connection_upgrade;
        proxy_pass http://explorer_backend_nebula;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
    location / { proxy_pass http://explorer_ui_origin; }
}
