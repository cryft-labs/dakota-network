map $http_upgrade $explorer_backend_connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=explorer_backend:10m rate=200r/s;
upstream explorer_backend_origin { server 127.0.0.1:4000; keepalive 32; }
server {
    listen 100.111.67.1:4002;
    listen 127.0.0.1:4002;
    server_name _;
    allow 127.0.0.1;
    allow 100.111.69.1;
    allow 100.111.1.4;
    deny all;
    client_max_body_size 8m;
    limit_req zone=explorer_backend burst=200 nodelay;
    limit_req_status 429;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $explorer_backend_connection_upgrade;
    proxy_next_upstream off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    location /socket {
        proxy_pass http://explorer_backend_origin;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
    location / { proxy_pass http://explorer_backend_origin; }
}
