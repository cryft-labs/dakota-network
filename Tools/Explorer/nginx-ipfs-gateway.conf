# Backend-01: read-only path gateway for the private Kubo node (127.0.0.1:8081, NoFetch).
# Consumers: the Blockscout API container (arrives as 100.111.67.1 through pasta),
# Frontend-01's explorer proxy, and the administrator workstation. Nebula only.
limit_req_zone $binary_remote_addr zone=ipfs_gateway:10m rate=50r/s;
map $upstream_status $ipfs_gateway_cache {
    default "no-store";
    200 "public, max-age=86400, immutable";
    206 "public, max-age=86400, immutable";
}
server {
    listen 100.111.67.1:8082;
    listen 127.0.0.1:8082;
    server_name _;
    allow 127.0.0.1;
    allow 100.111.67.1;
    allow 100.111.69.1;
    allow 100.111.1.4;
    deny all;
    client_max_body_size 1k;
    limit_req zone=ipfs_gateway burst=100 nodelay;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    location ^~ /ipfs/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://127.0.0.1:8081/ipfs/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_next_upstream off;
        add_header Cache-Control $ipfs_gateway_cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src data:; style-src 'unsafe-inline'; sandbox" always;
    }
    location / { return 404; }
}
