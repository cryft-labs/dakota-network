# Pente signing RPC is operator/backend access only. Never route public users here.
limit_req_zone $binary_remote_addr zone=paladin_rpc:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=paladin_conn:10m;
map $http_upgrade $paladin_upgrade { default upgrade; '' close; }
server {
    listen 100.111.32.201:8550;
    listen 127.0.0.1:8550;
    server_name _;
    allow 127.0.0.1;
    allow 100.111.1.4;
    allow 100.111.67.1;
    deny all;
    client_max_body_size 4m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    limit_conn paladin_conn 24;
    limit_conn_status 429;
    limit_req_status 429;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    location = / {
        if ($request_method != POST) { return 405; }
        limit_req zone=paladin_rpc burst=50 nodelay;
        proxy_pass http://127.0.0.1:8548;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_next_upstream off;
        proxy_buffering off;
    }
    location / { return 404; }
}
# Colocated Besu access for Paladin, also through the low privilege proxy.
server {
    listen 127.0.0.1:8552;
    server_name _;
    client_max_body_size 4m;
    location = / {
        if ($request_method != POST) { return 405; }
        proxy_pass http://127.0.0.1:8545;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_next_upstream off;
    }
    location = /ws {
        proxy_pass http://127.0.0.1:8546/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $paladin_upgrade;
        proxy_read_timeout 600s;
        proxy_next_upstream off;
    }
    location / { return 404; }
}
