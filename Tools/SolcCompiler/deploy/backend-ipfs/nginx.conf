# Base for a reviewed Backend-01 proxy installation; integrate other approved
# backend routes here. Do not run the distribution's root-master unit alongside it.
worker_processes 2;
pid /run/cryft-nginx/nginx.pid;
error_log stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Do not log URI/query strings, cookies or request bodies containing codes.
    log_format safe '$time_iso8601 $remote_addr $server_name $request_method '
                    '$status $body_bytes_sent $request_time $request_id';
    access_log /var/log/cryft-nginx/access.log safe;
    client_body_temp_path /var/cache/cryft-nginx/client_temp;
    proxy_temp_path /var/cache/cryft-nginx/proxy_temp;
    fastcgi_temp_path /var/cache/cryft-nginx/fastcgi_temp;
    uwsgi_temp_path /var/cache/cryft-nginx/uwsgi_temp;
    scgi_temp_path /var/cache/cryft-nginx/scgi_temp;
    client_max_body_size 1m;
    server_tokens off;
    server {
        listen 127.0.0.1:8080 default_server;
        server_name _;
        return 404;
    }
    include /etc/cryft/nginx/conf.d/*.conf;
}
