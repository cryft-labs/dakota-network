# Frontend-01 private development review. The loopback upstream is an SSH
# reverse forward to the operator computer's local Dakota build, not production.
limit_req_zone $binary_remote_addr zone=dakota_review:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=dakota_review_connections:10m;
server {
    listen 100.111.69.1:8083;
    server_name 100.111.69.1;
    allow 100.111.0.0/16;
    deny all;
    client_max_body_size 64k;
    limit_req zone=dakota_review burst=60 nodelay;
    limit_req_status 429;
    limit_conn dakota_review_connections 30;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location / {
        proxy_pass http://127.0.0.1:3013;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_next_upstream off;
    }
}
