# Incoming archive RPC uses Nginx over Nebula; the Besu origin stays on loopback.
# Public Cloudflare ingress must not target this private RPC listener.
limit_req_zone $binary_remote_addr zone=archive_rpc:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=archive_connections:10m;
# Gate sources before rewrite-phase OPTIONS responses, using the same peers as
# the previous allow/deny list. Browser CORS does not grant network access.
geo $archive_rpc_source_allowed {
    default 0;
    127.0.0.1 1;
    100.111.1.4 1;
    100.111.67.1 1;
    100.111.32.201 1;
    100.111.69.1 1;
}
# Exact review-site origins only. Production origins need a reviewed addition.
map $http_origin $archive_rpc_origin_allowed {
    default 0;
    '' 1;
    'http://localhost:3033' 1;
    'http://127.0.0.1:3033' 1;
    'http://100.111.1.4:3033' 1;
    'http://localhost:3034' 1;
    'http://127.0.0.1:3034' 1;
    'http://100.111.1.4:3034' 1;
    'http://localhost:3035' 1;
    'http://127.0.0.1:3035' 1;
    'http://100.111.1.4:3035' 1;
}
map $archive_rpc_origin_allowed $archive_rpc_cors_origin {
    default '';
    1 $http_origin;
}
map $http_upgrade $archive_connection_upgrade {
    default upgrade;
    '' close;
}
upstream archive_http {
    server 127.0.0.1:8545;
    keepalive 32;
}
server {
    listen 100.111.69.1:8547;
    listen 127.0.0.1:8547;
    server_name 100.111.69.1 localhost;
    if ($archive_rpc_source_allowed = 0) { return 403; }
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 60s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn archive_connections 40;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;
    location = / {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;
        add_header Vary Origin always;
        add_header Access-Control-Allow-Origin $archive_rpc_cors_origin always;
        add_header Access-Control-Allow-Methods 'POST, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Content-Type' always;
        if ($archive_rpc_origin_allowed = 0) { return 403; }
        if ($request_method = OPTIONS) { return 204; }
        if ($request_method != POST) { return 405; }
        limit_req zone=archive_rpc burst=100 nodelay;
        proxy_pass http://archive_http;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Origin "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_next_upstream off;
        proxy_cache off;
        proxy_buffering off;
    }
    location = /ws {
        if ($archive_rpc_origin_allowed = 0) { return 403; }
        if ($request_method != GET) { return 405; }
        limit_req zone=archive_rpc burst=20 nodelay;
        proxy_pass http://127.0.0.1:8546/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $archive_connection_upgrade;
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_send_timeout 60s;
        proxy_next_upstream off;
        proxy_buffering off;
    }
    location = /metrics {
        if ($request_method != GET) { return 405; }
        limit_req zone=archive_rpc burst=10 nodelay;
        proxy_pass http://127.0.0.1:9545/metrics;
        proxy_set_header Host 127.0.0.1;
        proxy_read_timeout 10s;
    }
    location / { return 404; }
}
