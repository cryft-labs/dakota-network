# Incoming archive RPC uses Nginx over Nebula; the Besu origin stays on loopback.
# Public Cloudflare ingress must not target this private RPC listener.
limit_req_zone $binary_remote_addr zone=archive_rpc:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=archive_connections:10m;
map $http_upgrade $archive_connection_upgrade {
    default upgrade;
    '' close;
}
upstream archive_http {
    server 127.0.0.1:8545;
    keepalive 32;
}
server {
    listen 100.111.69.1:8547;
    listen 127.0.0.1:8547;
    server_name 100.111.69.1 localhost;
    allow 127.0.0.1;
    allow 100.111.1.4;
    allow 100.111.67.1;
    allow 100.111.32.201;
    allow 100.111.69.1;
    deny all;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 60s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn archive_connections 40;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;
    location = / {
        if ($request_method != POST) { return 405; }
        limit_req zone=archive_rpc burst=100 nodelay;
        proxy_pass http://archive_http;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Origin "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_next_upstream off;
        proxy_cache off;
        proxy_buffering off;
    }
    location = /ws {
        if ($request_method != GET) { return 405; }
        limit_req zone=archive_rpc burst=20 nodelay;
        proxy_pass http://127.0.0.1:8546/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $archive_connection_upgrade;
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_send_timeout 60s;
        proxy_next_upstream off;
        proxy_buffering off;
    }
    location = /metrics {
        if ($request_method != GET) { return 405; }
        limit_req zone=archive_rpc burst=10 nodelay;
        proxy_pass http://127.0.0.1:9545/metrics;
        proxy_set_header Host 127.0.0.1;
        proxy_read_timeout 10s;
    }
    location / { return 404; }
}
